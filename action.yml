name: 'Living Documentation Collector for GitHub'
description: 'Collect living documentation data from GitHub repositories.'
inputs:
  # Base action inputs
  project-id:
    description: 'Project id written to every artifact''s `metadata.source.project_id`: lowercase letters, digits and hyphens, starting with a letter or digit.'
    required: true
  output-path:
    description: 'Output root; each mode writes `<output-path>/<mode>/<artifact>.json` and clears only its own `<mode>/` directory.'
    required: false
    default: './output/collector-gh'
  allow-partial:
    description: 'When `true`, a failed source is a `SOURCE_UNAVAILABLE` warning and the mode writes without it; the run still fails if every source failed.'
    required: false
    default: 'false'
  github-server-url:
    description: 'GitHub server the configured repositories live on, for `source_ref.url` permalinks; on GitHub Enterprise Server pass the workflow''s `github.server_url`.'
    required: false
    default: 'https://github.com'
  github-token:
    description: 'Optional and unused: the `doc-source` and `ui-tests` modes read local checkouts and make no GitHub API call.'
    required: false
    default: ''
  doc-issues:
    description: 'PLANNED - `Documentation Issues` mode is not available in this version; `true` fails the run at start.'
    required: false
    default: 'false'
  verbose-logging:
    description: 'Enable or disable verbose logging.'
    required: false
    default: 'false'

  # doc-issues mode action inputs - PLANNED after v0.1.0; not read in this version
  doc-issues-repositories:
    description: 'PLANNED - not read in this version.'
    required: false
    default: '[]'
  doc-issues-project-state-mining:
    description: 'PLANNED - not read in this version.'
    required: false
    default: 'false'

  # doc-source mode action inputs
  doc-source:
    description: 'Enable or disable `Documentation Source` mode.'
    required: true
  doc-source-repositories:
    description: 'JSON string defining the repositories for doc-source mode.'
    required: false
    default: '[]'

  # ui-tests mode action inputs
  ui-tests:
    description: 'Enable or disable `UI Tests` mode.'
    required: true
  ui-tests-repositories:
    description: 'JSON string defining the repositories for ui-tests mode.'
    required: false
    default: '[]'

outputs:
  output-path:
    description: 'Resolved absolute output root; each enabled mode''s artifact is at `<output-path>/<mode>/<artifact>.json`.'
    value: ${{ steps.liv-doc-collector.outputs.output-path }}

branding:
  icon: 'book'
  color: 'yellow'

runs:
  using: 'composite'
  steps:

    # The action brings its own virtual environment: it never installs into the runner's interpreter and
    # never touches the caller's `PATH`, `PYTHONPATH` or environment. The venv lives under `$RUNNER_TEMP`
    # and is reused, so two steps of this action in one job install once.
    - name: Check Python and create the collector's venv
      id: venv
      shell: bash
      run: |
        # The install must land in the venv and nowhere else. These redirect pip's target directory or
        # prepend to `sys.path`, so a caller that exports them would otherwise leave the venv empty or
        # shadow its packages. Unset (not set empty: pip reads its own vars as config values).
        unset PIP_TARGET PIP_PREFIX PIP_USER PYTHONPATH
        PY="$(command -v python3 || command -v python || true)"
        if [ -z "$PY" ] || ! "$PY" -c 'import sys; sys.exit(0 if sys.version_info >= (3, 10) else 1)'; then
          echo "::error::living-doc-collector-gh needs Python >= 3.10 on PATH. Add actions/setup-python before this step."; exit 1
        fi
        VENV="$RUNNER_TEMP/living-doc-collector-gh-venv"
        [ -x "$VENV/bin/python" ] || "$PY" -m venv "$VENV" || { echo "::error::'$PY -m venv' failed; install the venv module."; exit 1; }
        "$VENV/bin/pip" install -r "${{ github.action_path }}/requirements.txt"
        echo "python=$VENV/bin/python" >> "$GITHUB_OUTPUT"

    - name: Run Living Documentation Collector for GitHub
      id: liv-doc-collector
      env:
        INPUT_PROJECT_ID: ${{ inputs.project-id }}
        INPUT_OUTPUT_PATH: ${{ inputs.output-path }}
        INPUT_ALLOW_PARTIAL: ${{ inputs.allow-partial }}
        INPUT_GITHUB_SERVER_URL: ${{ inputs.github-server-url }}
        INPUT_DOC_ISSUES: ${{ inputs.doc-issues }}
        INPUT_DOC_SOURCE: ${{ inputs.doc-source }}
        INPUT_UI_TESTS: ${{ inputs.ui-tests }}

        INPUT_VERBOSE_LOGGING: ${{ inputs.verbose-logging }}

        # Passed verbatim: `action_inputs._get_repositories` reads them with `json.loads`, which tolerates
        # any whitespace, and a step `env:` value carries newlines as they are.
        INPUT_DOC_SOURCE_REPOSITORIES: ${{ inputs.doc-source-repositories }}
        INPUT_UI_TESTS_REPOSITORIES: ${{ inputs.ui-tests-repositories }}
      run: |
        # `-E`: a venv isolates site-packages, not the environment. A caller's `PYTHONPATH` still precedes
        # the venv on `sys.path`, so a package vendored there would shadow the pinned one; `-E` makes the
        # interpreter ignore the whole `PYTHON*` set. `INPUT_*` above is unaffected.
        "${{ steps.venv.outputs.python }}" -E "${{ github.action_path }}/main.py"
      shell: bash
