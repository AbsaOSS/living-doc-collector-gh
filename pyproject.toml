[project]
name = "living-doc-collector-gh"
version = "0.1.1"
description = "Collect living documentation data from GitHub repositories."
requires-python = ">=3.10"

[tool.black]
line-length = 120
target-version = ['py310']
# Mirrors the Makefile's `KEPT_ASIDE`. Anchored and `/`-delimited on purpose: an unanchored `test` matches
# `ui_tests/` and the whole `tests/` tree as substrings, which silently dropped 27 of the 41 files
# `make format-check` passes in - production code included.
force-exclude = '''^/(doc_issues|tests/doc_issues)/|^/(utils/github_project_queries|tests/utils/test_github_project_queries)\.py$'''

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
# `doc-issues` PLANNED after v0.1.0, kept aside unchanged for the port: its tests are not collected.
addopts = "--ignore=tests/doc_issues --ignore=tests/utils/test_github_project_queries.py"

[tool.coverage.run]
# `doc-issues` PLANNED after v0.1.0, kept aside unchanged for the port: doc_issues/ and the modules only it uses.
omit = ["tests/*", "doc_issues/*", "utils/github_project_queries.py"]

[tool.mypy]
check_untyped_defs = true
python_version = "3.10"
# `doc-issues` PLANNED after v0.1.0, kept aside unchanged for the port: doc_issues/ and the modules only it uses.
exclude = '^(tests|doc_issues)/|^utils/github_project_queries\.py$'
