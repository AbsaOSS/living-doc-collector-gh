name: "Integration Test"

# Runs the action's two active modes, `doc-source` and `ui-tests`, over this repository's committed
# fixtures. `doc-issues` is PLANNED after v0.1.0 and is not run.
on:
  pull_request:
    paths:
      - 'doc_source/**'
      - 'ui_tests/**'
      - 'utils/**'
      - 'main.py'
      - 'action_inputs.py'
      - 'pyproject.toml'
      - 'tests/fixtures/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'action.yml'
      - '.github/workflows/integration_test.yml'
  workflow_dispatch:

# Least privilege: every job here runs repository code through `uses: ./` and no mode makes a GitHub API
# call, so none of them needs more than read access.
permissions:
  contents: read

jobs:
  integration-test:
    runs-on: ubuntu-latest
    name: Integration Test - Real World Usage
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: 'requirements*.txt'

      - name: Install dependencies
        run: make install

      # No token: both modes read the local checkout and make no GitHub API call.
      - name: Run collector on the committed fixtures
        run: |
          FIXTURES="${GITHUB_WORKSPACE}/tests/fixtures"
          export INPUT_PROJECT_ID="living-doc-collector-gh"
          export INPUT_DOC_SOURCE="true"
          export INPUT_DOC_SOURCE_REPOSITORIES="[{\"organization-name\": \"AbsaOSS\", \"repository-name\": \"living-doc-collector-gh\", \"us-paths\": [\"${FIXTURES}/golden/gherkin/liv_doc_us\"], \"func-paths\": [\"${FIXTURES}/golden/gherkin/liv_doc_func\"], \"pages-paths\": [\"${FIXTURES}/golden/pageobject\"]}]"
          export INPUT_UI_TESTS="true"
          export INPUT_UI_TESTS_REPOSITORIES="[{\"organization-name\": \"AbsaOSS\", \"repository-name\": \"living-doc-collector-gh\", \"paths\": [\"${FIXTURES}/golden/gherkin\", \"${FIXTURES}/full_sample/ui_tests\"]}]"
          export INPUT_VERBOSE_LOGGING="true"

          python3 main.py

      - name: Validate the artifacts against their contracts
        run: |
          python3 << 'EOF'
          import subprocess

          from living_doc_utilities.contracts.doc_source import DocSourceResult
          from living_doc_utilities.contracts.io import read_artifact
          from living_doc_utilities.contracts.ui_tests import UITestsResult

          head = subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True, check=True, text=True).stdout.strip()
          permalink = f"https://github.com/AbsaOSS/living-doc-collector-gh/blob/{head}/"

          doc_source = read_artifact("./output/collector-gh/doc-source/doc-source.json", "doc-source")
          assert isinstance(doc_source, DocSourceResult)
          assert doc_source.metadata.producer.name == "AbsaOSS/living-doc-collector-gh"
          assert doc_source.metadata.source.project_id == "living-doc-collector-gh"
          entities = [*doc_source.user_stories, *doc_source.features, *doc_source.functionalities]
          ids = sorted(e.entity_id for e in entities)
          assert ids == ["FEAT-001", "FEAT-003", "FUNC-001", "FUNC-002", "US-001"], ids
          assert all(e.source_ref.url.startswith(permalink) for e in entities), [e.source_ref.url for e in entities]
          print(f"✓ doc-source: {len(ids)} entities, {len(doc_source.warnings)} warning(s)")

          ui_tests = read_artifact("./output/collector-gh/ui-tests/ui-tests.json", "ui-tests")
          assert isinstance(ui_tests, UITestsResult)
          assert ui_tests.metadata.source.project_id == "living-doc-collector-gh"
          assert ui_tests.scenarios, "no scenario collected"
          assert all(s.source_ref.url.startswith(permalink) for s in ui_tests.scenarios)
          print(f"✓ ui-tests: {len(ui_tests.scenarios)} scenarios, {len(ui_tests.warnings)} warning(s)")
          EOF

      - name: Upload output artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integration-test-output
          path: ./output/collector-gh/
          retention-days: 7

  # The action brings its own venv (`DEC-24`): it installs nothing into the runner's interpreter and leaves
  # the caller's `PATH` and packages untouched. Two steps of the action in one job share and reuse the venv.
  action-venv-isolation:
    runs-on: ubuntu-latest
    name: Action Venv - Isolation and Reuse
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # 3.12, not the action image's 3.14: pydantic 1.x, the conflicting pin below, publishes wheels for it.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      # A pydantic the collector cannot run on: were the action using this interpreter it would fail, and
      # were it installing into this interpreter, this version would be gone by the last step.
      - name: Install a conflicting pydantic into the runner's interpreter
        run: |
          set -euo pipefail
          pip install 'pydantic<2'
          {
            which python
            python --version
            python -c 'import pydantic; print(pydantic.VERSION)'
          } | tee "${RUNNER_TEMP}/before.txt"

      - name: Run the action (first step)
        uses: ./
        with:
          project-id: living-doc-collector-gh
          output-path: ${{ github.workspace }}/output/first
          doc-source: 'true'
          doc-source-repositories: |
            [{"organization-name": "AbsaOSS", "repository-name": "living-doc-collector-gh",
              "us-paths": ["${{ github.workspace }}/tests/fixtures/golden/gherkin/liv_doc_us"],
              "func-paths": ["${{ github.workspace }}/tests/fixtures/golden/gherkin/liv_doc_func"],
              "pages-paths": ["${{ github.workspace }}/tests/fixtures/golden/pageobject"]}]
          ui-tests: 'false'

      # `pyvenv.cfg`'s mtime, not a stray marker file: `python -m venv` without `--clear` leaves pre-existing
      # files in the target directory alone, so a marker survives a full re-create and proves nothing. The
      # config is rewritten (mode `w`) on every create, so an unchanged mtime can only mean the venv was reused.
      - name: Stamp the venv
        run: stat -c %Y "${RUNNER_TEMP}/living-doc-collector-gh-venv/pyvenv.cfg" > "${RUNNER_TEMP}/venv-cfg-mtime.txt"

      - name: Run the action (second step)
        uses: ./
        with:
          project-id: living-doc-collector-gh
          output-path: ${{ github.workspace }}/output/second
          doc-source: 'false'
          ui-tests: 'true'
          ui-tests-repositories: |
            [{"organization-name": "AbsaOSS", "repository-name": "living-doc-collector-gh",
              "paths": ["${{ github.workspace }}/tests/fixtures/full_sample/ui_tests"]}]

      - name: Both steps wrote their artifact, the venv was reused, the caller's environment is unchanged
        run: |
          set -euo pipefail
          test -f "${{ github.workspace }}/output/first/doc-source/doc-source.json"
          test -f "${{ github.workspace }}/output/second/ui-tests/ui-tests.json"
          # Each step wrote only the mode it enabled. A disabled mode that still produced an artifact would
          # mean the first step's inputs leaked into the second - which is what dropping `$GITHUB_ENV` fixed,
          # and what comparing interpreters below cannot see.
          test ! -e "${{ github.workspace }}/output/second/doc-source"
          test ! -e "${{ github.workspace }}/output/first/ui-tests"
          # `pyvenv.cfg` was not rewritten, so the second step reused the venv instead of recreating it.
          test "$(stat -c %Y "${RUNNER_TEMP}/living-doc-collector-gh-venv/pyvenv.cfg")" \
            = "$(cat "${RUNNER_TEMP}/venv-cfg-mtime.txt")"
          {
            which python
            python --version
            python -c 'import pydantic; print(pydantic.VERSION)'
          } | tee "${RUNNER_TEMP}/after.txt"
          diff "${RUNNER_TEMP}/before.txt" "${RUNNER_TEMP}/after.txt"
          echo '::notice::both steps succeeded, the venv was reused, and the runner interpreter is unchanged.'

  # Python older than the 3.10 floor fails the action with one actionable error, before it creates any venv.
  action-rejects-python-39:
    runs-on: ubuntu-latest
    name: Action Venv - Python 3.9 Is Rejected
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python 3.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.9'

      - name: Run the action, which must fail
        id: run-on-39
        continue-on-error: true
        uses: ./
        with:
          project-id: living-doc-collector-gh
          doc-source: 'false'
          ui-tests: 'false'

      - name: The action failed on the version check, before creating a venv
        run: |
          set -euo pipefail
          # `PATH`'s Python really is the one the floor rejects: without this the job would also pass if
          # `setup-python` resolved something newer and the action failed for an unrelated reason.
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 9), sys.version'
          if [[ "${{ steps.run-on-39.outcome }}" != "failure" ]]; then
            echo "::error::the action must fail when PATH's Python is older than 3.10."; exit 1
          fi
          if [[ -d "${RUNNER_TEMP}/living-doc-collector-gh-venv" ]]; then
            echo "::error::the action must fail the version check before it creates a venv."; exit 1
          fi
